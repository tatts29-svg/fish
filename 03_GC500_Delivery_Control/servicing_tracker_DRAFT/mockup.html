<style>
/* Layout: one column for a phone held in one hand at night: a sticky night bar, then thirteen area cards that open into tick rows. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --line:#d9d4c8; --ink:#1d1a15; --mute:#6c655a;
  --hivis:#c96a00; --hivis-ink:#ffffff; --done:#16803a; --done-soft:#e3f3e7; --warn:#a33a1c;
  --track:#e6e1d6; --chip:#ece7dc;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f; --panel:#1e1c17; --line:#34312a; --ink:#f2eee4; --mute:#a69f91;
  --hivis:#ffb020; --hivis-ink:#1a1407; --done:#3ccf6a; --done-soft:#17301f; --warn:#ff8a65;
  --track:#2d2a23; --chip:#2a2721; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130f; --panel:#1e1c17; --line:#34312a; --ink:#f2eee4; --mute:#a69f91;
  --hivis:#ffb020; --hivis-ink:#1a1407; --done:#3ccf6a; --done-soft:#17301f; --warn:#ff8a65;
  --track:#2d2a23; --chip:#2a2721; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(21px,6.2vw,26px);white-space:nowrap;letter-spacing:.02em;margin:0;text-transform:uppercase}
.mock{font-size:12px;font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;min-height:48px}
.day b{display:block;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.05}
.day span{font-size:11px;color:var(--mute)}
.day[aria-pressed="true"]{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.day[aria-pressed="true"] span{color:var(--hivis-ink);opacity:.85}
.day:focus-visible,.tick:focus-visible,.ahead:focus-visible,.nav:focus-visible,.undo:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
.window{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.window b{color:var(--ink);font-weight:600}
.overall{display:grid;gap:4px}
.ovtext{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600}
.ovtext em{font-style:normal;font-family:var(--display);font-size:22px;font-weight:800}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hivis);border-radius:5px;transition:width .35s ease}
.bar.full i{background:var(--done)}
main .wrap{max-width:760px;margin:0 auto;padding-block:14px 40px;display:grid;gap:10px}
.area{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.area.complete{border-color:var(--done)}
.ahead{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;cursor:pointer}
.anum{font-family:var(--display);font-weight:800;font-size:28px;width:34px;text-align:center;color:var(--mute)}
.area.complete .anum{color:var(--done)}
.aname{font-weight:700;font-size:16px;min-width:0}
.ameta{grid-column:2;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.apct{grid-row:1/span 2;grid-column:3;font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;text-align:right}
.area .bar{grid-column:1/-1;height:6px}
.fin{color:var(--done);font-weight:700}
.rows{border-top:1px solid var(--line);display:grid}
.row{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row.done{background:var(--done-soft)}
.tick{all:unset;box-sizing:border-box;width:56px;height:56px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;background:var(--bg)}
.tick svg{width:30px;height:30px;stroke:transparent;stroke-width:4;fill:none}
.row.done .tick{background:var(--done);border-color:var(--done)}
.row.done .tick svg{stroke:#fff}
.rinfo{min-width:0;display:grid;gap:3px}
.rtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ref{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;line-height:1}
.qty{font-weight:700;font-size:14px;background:var(--chip);border-radius:6px;padding:1px 7px}
.when{margin-left:auto;font-weight:700;color:var(--done);font-variant-numeric:tabular-nums;font-size:14px}
.where{font-size:14px}
.nos{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.nav{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;box-sizing:border-box}
.nopin{font-size:13px;color:var(--mute);padding:6px 0}
.undo{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
.note{font-size:13px;color:var(--mute);max-width:65ch}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

const TZ = 'Australia/Brisbane', DAY0 = Date.UTC(2026, 9, 21, 22, 0), H24 = 86400000;
const DAYS = [0, 1, 2, 3].map(i => ({i, start: DAY0 + i * H24, end: DAY0 + (i + 1) * H24}));
const fmt = (t, o) => new Intl.DateTimeFormat('en-AU', Object.assign({timeZone: TZ}, o)).format(new Date(t));
const hm = t => fmt(t, {hour: '2-digit', minute: '2-digit', hour12: false});
const dname = t => fmt(t, {weekday: 'short', day: 'numeric'});
const TOTAL = AREAS.reduce((n, a) => n + a.refs.reduce((m, r) => m + r.qty, 0), 0);
let store = {}; try { store = JSON.parse(localStorage.getItem('gc500svc') || '{}') || {}; } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem('gc500svc', JSON.stringify(store)); } catch (e) {} };
const nowDay = () => { const n = Date.now(); const d = DAYS.find(x => n >= x.start && n < x.end); return d ? d.i : (n < DAY0 ? 0 : 3); };
let day = nowDay(), open = new Set(), undoFor = null;
const m = /^#a(\d+)$/.exec(location.hash); if (m) open.add(+m[1]);
const log = () => (store[day] = store[day] || {});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const TICK = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 17l6 6L25 9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function renderDays(){
  document.getElementById('days').innerHTML = DAYS.map(d => '<button class="day" type="button" id="day' + d.i + '" aria-pressed="' + (d.i === day) + '" data-day="' + d.i + '"><b>' + esc(fmt(d.start, {weekday: 'short'})) + ' ' + esc(fmt(d.start, {day: 'numeric'})) + '</b><span>to ' + esc(dname(d.end)) + '</span></button>').join('');
  const d = DAYS[day], n = Date.now();
  const state = n < d.start ? 'Starts ' + dname(d.start) + ' Oct 08:00' : n >= d.end ? 'Closed ' + dname(d.end) + ' Oct 08:00' : 'Open now · closes 08:00 ' + dname(d.end);
  document.getElementById('window').innerHTML = '<span><b>' + esc(dname(d.start)) + ' 08:00 → ' + esc(dname(d.end)) + ' 08:00</b></span><span>' + esc(state) + '</span>';
}
function areaStats(a){
  const L = log(); let units = 0, refs = 0, last = 0;
  for (const r of a.refs) if (L[r.ref]) { units += r.qty; refs++; last = Math.max(last, L[r.ref]); }
  const tot = a.refs.reduce((n, r) => n + r.qty, 0);
  return {units, refs, tot, pct: Math.round(units * 100 / tot), finished: refs === a.refs.length ? last : 0};
}
function rowHtml(r){
  const t = log()[r.ref], done = !!t;
  const nav = r.pin ? '<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=' + r.pin[0] + ',' + r.pin[1] + '" target="_blank" rel="noopener">Navigate ↗</a>' : '<span class="nopin">No pin on the record · ask on site</span>';
  const undo = done && undoFor === r.ref ? '<button class="undo" type="button" data-undo="' + esc(r.ref) + '">Undo tick</button>' : '';
  return '<div class="row' + (done ? ' done' : '') + '"><button class="tick" type="button" id="t-' + esc(r.ref) + '" data-ref="' + esc(r.ref) + '" aria-pressed="' + done + '" aria-label="' + esc(r.ref) + (done ? ' serviced at ' + hm(t) : ' not serviced yet') + '">' + TICK + '</button>' +
    '<div class="rinfo"><div class="rtop"><span class="ref">' + esc(r.ref) + '</span><span class="qty">' + esc(r.types) + '</span>' + (done ? '<span class="when">Done ' + hm(t) + '</span>' : '') + '</div>' +
    (r.where || r.drop ? '<div class="where">' + esc([r.where, r.drop].filter(Boolean).join(' · ')) + '</div>' : '') +
    '<div class="nos">Units ' + esc(r.nos.join(', ')) + '</div><div class="acts">' + nav + undo + '</div></div></div>';
}
function render(){
  renderDays();
  let units = 0;
  document.getElementById('areas').innerHTML = AREAS.map(a => {
    const s = areaStats(a); units += s.units; const isOpen = open.has(a.n);
    return '<section class="area' + (s.finished ? ' complete' : '') + '" id="a' + a.n + '"><button class="ahead" type="button" data-area="' + a.n + '" aria-expanded="' + isOpen + '">' +
      '<span class="anum">' + a.n + '</span><span class="aname">' + esc(a.name) + '</span><span class="apct">' + s.pct + '%</span>' +
      '<span class="ameta">' + (s.finished ? '<span class="fin">Area finished ' + hm(s.finished) + '</span> · ' : '') + s.refs + ' of ' + a.refs.length + ' locations · ' + s.units + ' of ' + s.tot + ' units</span>' +
      '<span class="bar' + (s.finished ? ' full' : '') + '"><i style="width:' + s.pct + '%"></i></span></button>' +
      (isOpen ? '<div class="rows">' + a.refs.map(rowHtml).join('') + '</div>' : '') + '</section>';
  }).join('');
  const pct = Math.round(units * 100 / TOTAL);
  document.getElementById('ovunits').textContent = units + ' of ' + TOTAL + ' units serviced';
  document.getElementById('ovpct').textContent = pct + '%';
  const ob = document.getElementById('ovbar'); ob.querySelector('i').style.width = pct + '%'; ob.classList.toggle('full', pct === 100);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-day],[data-area],[data-ref],[data-undo]'); if (!b) return;
  if (b.dataset.day) { day = +b.dataset.day; undoFor = null; render(); return; }
  if (b.dataset.area) { const n = +b.dataset.area; open.has(n) ? open.delete(n) : open.add(n); render(); return; }
  if (b.dataset.undo) { delete log()[b.dataset.undo]; undoFor = null; save(); render(); return; }
  const ref = b.dataset.ref, L = log();
  if (L[ref]) { undoFor = undoFor === ref ? null : ref; render(); return; }    /* a done row asks before it unticks */
  L[ref] = Date.now(); undoFor = null; save(); render();
  const t = document.getElementById('t-' + ref); if (t) t.focus({preventScroll: true});
});
render();
</script>
