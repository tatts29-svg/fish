<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

<title>GC500 Servicing</title>
<style>
/* GC500 servicing tracker, crew card. Author: Andrew Fisher.
   Layout: one column for a phone held in one hand at night. A sticky header carries the service day, the loud
   day banner and the progress bars (this area and everything), so the percentages stay in view after every tap.
   Below it: the reference's own card (completion QR) or the read-only list of areas (no QR code). */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --line:#d9d4c8; --ink:#1d1a15; --mute:#5f584d;
  --hivis:#b35e00; --hivis-ink:#ffffff; --done:#14762f; --done-ink:#ffffff; --done-soft:#e3f3e7; --warn:#a33a1c; --warn-ink:#ffffff;
  --warn-soft:#fbe7df; --track:#e6e1d6; --chip:#ece7dc; --wait:#7a5a00; --wait-soft:#fff3cf;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f; --panel:#1e1c17; --line:#3a362e; --ink:#f2eee4; --mute:#b3ab9c;
  --hivis:#ffb020; --hivis-ink:#1a1407; --done:#3ccf6a; --done-ink:#0b1f10; --done-soft:#17301f; --warn:#ff8a65; --warn-ink:#1f0b05;
  --warn-soft:#3a1d14; --track:#2d2a23; --chip:#2a2721; --wait:#ffd166; --wait-soft:#3a3115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130f; --panel:#1e1c17; --line:#3a362e; --ink:#f2eee4; --mute:#b3ab9c;
  --hivis:#ffb020; --hivis-ink:#1a1407; --done:#3ccf6a; --done-ink:#0b1f10; --done-soft:#17301f; --warn:#ff8a65; --warn-ink:#1f0b05;
  --warn-soft:#3a1d14; --track:#2d2a23; --chip:#2a2721; --wait:#ffd166; --wait-soft:#3a3115; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{padding-top:6px;padding-bottom:8px;display:grid;gap:6px}
.top{display:grid;gap:0}      /* status always on its own line, so the header keeps one height whatever it says */
h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,25px);letter-spacing:.02em;margin:0;text-transform:uppercase;white-space:nowrap}
.status{font-size:12.5px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--done);margin-right:6px;vertical-align:1px}
.status.wait{color:var(--wait)}
.status.bad{color:var(--warn)}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:5px 2px;text-align:center;cursor:pointer;min-height:48px;position:relative}
.day b{display:block;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.05}
.day span{display:block;font-size:11px;color:var(--mute);line-height:1.2}
.day.today::after{content:"";position:absolute;left:30%;right:30%;bottom:3px;height:3px;border-radius:2px;background:var(--done)}
.day[aria-pressed="true"]{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.day[aria-pressed="true"] span{color:var(--hivis-ink)}
.window{font-size:12.5px;color:var(--mute);display:grid;gap:0}
.window b{color:var(--ink);font-weight:600}
.bars{display:grid;gap:4px}
.pl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:14px}
.pl .pn{min-width:0}
.pl em{font-style:normal;font-family:var(--display);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;flex-shrink:0}
.pm{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:1px}
.fin{color:var(--done);font-weight:700}
.bar{height:8px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hivis);border-radius:5px;transition:width .35s ease}
.bar.full i{background:var(--done)}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:8px;border:2px solid var(--line);background:var(--chip)}
.banner strong{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.banner.loud{background:var(--warn);border-color:var(--warn);color:var(--warn-ink)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.info{background:var(--wait-soft);border-color:var(--wait)}
.banner .bacts{display:flex;gap:8px;flex-wrap:wrap}
.bbtn{border:2px solid currentColor;background:transparent;border-radius:9px;padding:8px 12px;min-height:44px;font-weight:700;cursor:pointer}
.banner.loud .bbtn{background:var(--warn-ink);color:var(--warn);border-color:var(--warn-ink)}
.banner a{color:inherit;font-weight:700}
main .wrap{padding-top:14px;padding-bottom:24px;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.refcard{padding:14px 14px 6px;display:grid;gap:8px}
.bigref{font-family:var(--display);font-weight:800;font-size:clamp(52px,17vw,76px);letter-spacing:.02em;line-height:.95;margin:0}
.reftitle{font-weight:700;font-size:15px}
.refarea{font-weight:700;font-size:16px}
.refarea span{color:var(--mute);font-weight:600}
.count{font-weight:700;font-size:15px;background:var(--chip);border-radius:8px;padding:6px 10px;justify-self:start}
.where{font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.nav{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
.nopin{font-size:13.5px;color:var(--mute);margin:0}
.line{border-top:1px solid var(--line);margin:4px -14px 0;padding:12px 14px 10px;display:grid;gap:8px}
.ltitle{margin:0;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05}
.nos{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin:0}
.nos b{color:var(--ink);font-weight:600}
.jobs{display:grid;gap:8px}
.job{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;cursor:pointer}
.job .jbox{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;background:var(--panel)}
.job svg{width:28px;height:28px;stroke:transparent;stroke-width:4;fill:none}
.job b{display:block;font-size:19px;font-weight:700;line-height:1.15}
.job small{display:block;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.job.done{background:var(--done-soft);border-color:var(--done)}
.job.done .jbox{background:var(--done);border-color:var(--done)}
.job.done svg{stroke:var(--done-ink)}
.job.done small{color:var(--done);font-weight:700}
.job.pending{background:var(--wait-soft);border-color:var(--wait)}
.job.pending .jbox{background:var(--wait);border-color:var(--wait)}
.job.pending svg{stroke:var(--panel)}
.job.pending small{color:var(--wait);font-weight:700}
.job[disabled]{cursor:not-allowed;opacity:.62}
.confirm{display:grid;gap:8px;border:2px solid var(--warn);border-radius:12px;padding:10px 12px;background:var(--warn-soft)}
.confirm p{margin:0;font-weight:700}
.confirm .bacts{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;min-height:48px;font-weight:700;cursor:pointer}
.cbtn.undo{border-color:var(--warn);background:var(--warn);color:var(--warn-ink)}
.showall{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;min-height:48px;font-weight:700;cursor:pointer}
.viewonly{font-size:14px;color:var(--mute);margin:0}
.area{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.area.complete{border-color:var(--done)}
.ahead{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;cursor:pointer}
.anum{font-family:var(--display);font-weight:800;font-size:28px;min-width:34px;text-align:center;color:var(--mute)}
.area.complete .anum{color:var(--done)}
.aname{font-weight:700;font-size:16px;min-width:0}
.ameta{grid-column:2;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.apct{grid-row:1/span 2;grid-column:3;font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;text-align:right}
.area .bar{grid-column:1/-1;height:6px}
.rows{border-top:1px solid var(--line);display:grid}
.orow{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.orow:last-child{border-bottom:0}
.orow.done{background:var(--done-soft)}
.rtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ref{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;line-height:1}
.when{margin-left:auto;font-weight:700;color:var(--done);font-variant-numeric:tabular-nums;font-size:14px}
.oline{display:grid;gap:4px}
.oline b{font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--mute);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--done);color:var(--done-ink);font-weight:700}
.chip.wt{background:var(--wait);color:var(--panel);font-weight:700}
footer .wrap{padding-bottom:36px}
.note{font-size:13px;color:var(--mute);max-width:65ch;margin:0 0 6px}
.note a{color:var(--ink);font-weight:700}
.day:focus-visible,.job:focus-visible,.ahead:focus-visible,.nav:focus-visible,.cbtn:focus-visible,.bbtn:focus-visible,.showall:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:380px){.job b{font-size:18px}.ltitle{font-size:24px}}
</style>
</head>

  var d = dayOf(day), s = dayStart(day), e = s + 24 * HOUR, n = now();
  var state = n < s ? 'Opens ' + d.label + ' 08:00' : n >= e ? 'Closed ' + d.to + ' 08:00' : 'Open now · closes 08:00 ' + d.to;
  return '<span><b>' + esc(d.label + ' 08:00 → ' + d.to + ' 08:00') + '</b>' + (d.ifNeeded ? ' · only if Thursday is serviced' : '') + (d.plan === 'final' ? ' · last night' : '') + '</span><span>' + esc(state) + '</span>';
}
function progHtml(label, s, refWord) {
  return '<div><div class="pl"><span class="pn">' + esc(label) + '</span><em>' + s.pct + '%</em></div>' + bar(s.pct, !!s.finished) +
    '<div class="pm">' + (s.finished ? '<span class="fin">' + (refWord === 'area' ? 'Area finished ' : 'All finished ') + hm(s.finished) + '</span> · ' : '') + s.refsDone + ' of ' + s.refs + ' references · ' + s.d + ' of ' + s.w + ' jobs</div></div>';
}
function jobHtml(r, l, task, day, st, open) {
  var key = l.id + '|' + task, s = st[jobKey(l.id, task, day)], label = TASKS[task] || task;
  var cls = 'job' + (s ? (s.local ? ' pending' : ' done') : '');
  var sub = !open ? 'Opens ' + shortDay(day) + ' 08:00' : s ? 'Done ' + hm(s.at) + (s.local ? ' · waiting for signal' : '') : 'Tap when done';
  var aria = label + ', ' + l.label + ', ' + (s ? 'done at ' + hm(s.at) + (s.local ? ', waiting for signal' : '') + '. Tap to undo.' : open ? 'not done yet' : 'not open yet');
  var h = '<button class="' + cls + '" type="button" id="j-' + esc(key) + '" data-job="' + esc(key) + '" aria-pressed="' + (!!s) + '" aria-label="' + esc(aria) + '"' + (open && !final ? '' : ' disabled') + '><span class="jbox">' + TICK + '</span><span class="jtxt"><b>' + esc(label) + '</b><small>' + esc(sub) + '</small></span></button>';
  if (confirmKey === key && s) h += '<div class="confirm" id="c-' + esc(key) + '" role="group" aria-label="Undo ' + esc(label) + '"><p>Undo “' + esc(label) + '” for ' + esc(l.label) + '?</p><div class="bacts"><button class="cbtn undo" type="button" id="u-' + esc(key) + '" data-undo="' + esc(key) + '">Yes, undo</button><button class="cbtn" type="button" data-keep="1">Keep it done</button></div></div>';
  return h;
}
function tickView(day, st) {
  var r = REFS[curRef], a = AREA_OF[curRef], open = dayOpen(day), n = unitsOf(r);
  var h = '<section class="card refcard" aria-labelledby="refh"><h2 class="bigref" id="refh">' + esc(r.ref) + '</h2>' +
    (r.title && r.title !== r.ref ? '<div class="reftitle">' + esc(r.title) + '</div>' : '') +
    '<div class="refarea">' + (a.n ? 'Area ' + a.n + ' <span>· ' + esc(a.name) + '</span>' : esc(a.name)) + '</div>' +
    '<div class="count">' + n + ' unit' + (n === 1 ? '' : 's') + ' at ' + esc(r.ref) + (r.lines.length > 1 ? ' · ' + r.lines.length + ' completion lines' : '') + '</div>' +
    ((r.where || r.drop) ? '<div class="where">' + esc([r.where, r.drop].filter(Boolean).join(' · ')) + '</div>' : '') + navHtml(r);
  r.lines.forEach(function (l) {
    h += '<div class="line"><h3 class="ltitle">' + esc(l.label) + '</h3>' + (l.nos && l.nos.length ? '<p class="nos"><b>Asset nos</b> ' + esc(l.nos.join(', ')) + '</p>' : '') +
      '<div class="jobs" role="group" aria-label="' + esc(l.label + ', ' + longDay(day) + '\'s jobs') + '">' + tasksFor(l, day).map(function (t) { return jobHtml(r, l, t, day, st, open); }).join('') + '</div></div>';
  });
  h += '</section>';
  h += '<button class="showall" type="button" data-showall="1" aria-expanded="' + showAll + '">' + (showAll ? 'Hide the other areas' : 'Show every area (view only)') + '</button>';
  if (showAll) h += areasHtml(day, st, curRef);
  return h;
}
function orowHtml(r, day, st) {
  var rs = refStats(r, day, st);
  var h = '<div class="orow' + (rs.done ? ' done' : '') + '"><div class="rtop"><span class="ref">' + esc(r.ref) + '</span>' + (rs.done ? '<span class="when">Done ' + hm(rs.last) + '</span>' : '') + '</div>';
  r.lines.forEach(function (l) {
    h += '<div class="oline"><b>' + esc(l.label) + '</b><div class="chips">' + tasksFor(l, day).map(function (t) {
      var s = st[jobKey(l.id, t, day)];
      return '<span class="chip' + (s ? (s.local ? ' wt' : ' ok') : '') + '">' + esc(TASKS[t] || t) + (s ? ' ' + hm(s.at) : '') + '</span>';
    }).join('') + '</div>' + (l.nos && l.nos.length ? '<p class="nos"><b>Asset nos</b> ' + esc(l.nos.join(', ')) + '</p>' : '') + '</div>';
  });
  if (r.where || r.drop || r.title !== r.ref) h += '<div class="where">' + esc([r.title !== r.ref ? r.title : '', r.where, r.drop].filter(Boolean).join(' · ')) + '</div>';
  return h + navHtml(r) + '</div>';
}
function areasHtml(day, st, skipRef) {
  return AREAS.map(function (a) {
    var s = groupStats(a.refs, day, st), isOpen = !!openAreas[a.n];
    return '<section class="area' + (s.finished ? ' complete' : '') + '" id="a' + a.n + '"><button class="ahead" type="button" id="ah-' + a.n + '" data-area="' + a.n + '" aria-expanded="' + isOpen + '">' +
      '<span class="anum">' + (a.n || '–') + '</span><span class="aname">' + esc(a.name) + '</span><span class="apct">' + s.pct + '%</span>' +
      '<span class="ameta">' + (s.finished ? '<span class="fin">Area finished ' + hm(s.finished) + '</span> · ' : '') + s.refsDone + ' of ' + s.refs + ' references · ' + a.refs.reduce(function (n, r) { return n + unitsOf(r); }, 0) + ' units</span>' +
      bar(s.pct, !!s.finished) + '</button>' + (isOpen ? '<div class="rows">' + a.refs.map(function (r) { return orowHtml(r, day, st); }).join('') + '</div>' : '') + '</section>';
  }).join('');
}
function viewHtml(day, st) {
  return '<p class="viewonly">View only. To tick a reference, scan the completion QR code printed for it.</p>' + areasHtml(day, st);
}

var lastParts = {};
function render() {
  var day = shownDay(), auto = autoDay(now());
  var st = jobStates(allEvents(), now());
  renderStatus();
  var bars;
  var os = groupStats(ALL_REFS, day, st);
  if (mode === 'tick') {
    var a = AREA_OF[curRef];
    bars = progHtml(areaLabel(a), groupStats(a.refs, day, st), 'area') + progHtml('Everything', os, 'all');
  } else bars = progHtml('Everything · ' + longDay(day), os, 'all');
  var parts = {
    banners: bannersHtml(day, auto), days: daysHtml(day, auto), window: windowHtml(day), bars: bars,
    view: mode === 'tick' ? tickView(day, st) : viewHtml(day, st),
  };
  /* only a part that changed is redrawn, so a poll that changes nothing never replaces a button under a finger */
  var changed = Object.keys(parts).filter(function (k) { return lastParts[k] !== parts[k]; });
  if (!changed.length) return;
  var focusId = document.activeElement && document.activeElement.id;
  changed.forEach(function (k) { var el = document.getElementById(k); if (el) el.innerHTML = parts[k]; lastParts[k] = parts[k]; });
  document.documentElement.setAttribute('data-mode', mode);
  padForHeader();
  if (focusId && document.activeElement !== document.getElementById(focusId)) refocus(focusId);
}

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-day],[data-job],[data-undo],[data-keep],[data-area],[data-showall],[data-back],[data-stay],[data-dismiss],[data-reload]');
  if (!b || b.disabled) return;
  var ds = b.dataset;
  if (ds.day) { choose(ds.day); render(); refocus('day-' + ds.day); return; }
  if (ds.job) { tapJob(ds.job); return; }
  if (ds.undo) { undoJob(ds.undo); return; }
  if (ds.keep) { var k = confirmKey; confirmKey = null; render(); if (k) refocus('j-' + k); return; }
  if (ds.area) { var n = +ds.area; if (openAreas[n]) delete openAreas[n]; else openAreas[n] = 1; render(); refocus('ah-' + n); return; }
  if (ds.showall) { showAll = !showAll; render(); return; }
  if (ds.reload) { location.reload(); return; }
  if (ds.back) { pick = null; advance = null; render(); return; }
  if (ds.stay) { pick = { day: ds.stay, at: svcDay(now()) }; advance = null; render(); return; }
  if (ds.dismiss) { if (ds.dismiss === 'advance') advance = null; else notices.splice(+ds.dismiss.slice(1), 1); render(); }
});
window.addEventListener('hashchange', function () { readHash(); render(); scrollToFocus(); focusPending = true; poll(); });
['touchstart', 'wheel', 'keydown'].forEach(function (t) { window.addEventListener(t, function () { focusPending = false; }, { passive: true }); });
window.addEventListener('online', function () { netDown = false; if (!busyUntil || Date.now() >= busyUntil) { pausedUntil = 0; backoffStep = 0; } poll(); pump(); render(); });
window.addEventListener('offline', function () { netDown = true; render(); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { watchClock(); render(); poll(); pump(); } });
/* the sticky header covers the top of the page: the browser's own jump to #a7, and ours, stop below it */
function padForHeader() { var hd = document.querySelector('header'); if (hd) document.documentElement.style.scrollPaddingTop = (hd.offsetHeight + 8) + 'px'; }
window.addEventListener('resize', padForHeader);
function scrollToFocus() {
  if (mode === 'tick') { window.scrollTo(0, 0); return; }
  if (focusArea != null) {
    padForHeader();
    var el = document.getElementById('a' + focusArea);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
  }
}
setInterval(function () { if (final) { renderStatus(); return; } watchClock(); render(); }, 5000);

/* for the tests only: pure functions and a read-only look at the state */
window.svc1063 = { svcDay: svcDay, autoDay: autoDay, jobStates: jobStates, groupStats: groupStats, refStats: refStats,
  tasksFor: tasksFor, shownDay: shownDay, now: now, offset: function () { return offset; },
  outbox: function () { return outbox.map(wire); }, mode: function () { return mode; }, final: function () { return final; },
  areas: AREAS, days: DAYS };

readHash();
render(); scrollToFocus();
poll();
if (outbox.length) pump();
})();
