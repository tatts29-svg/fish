<title>GC500 3D Proof</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.131.0/Build/Cesium/Widgets/widgets.css">
<style>
:root{--or:#ff6a13;--or2:#ff9a4d;--ink:#f3efe9;--mute:#a9a39c;--bg:#0f0d0c;--rule:#2e2723}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#cesium{position:absolute;inset:0}
header{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(180deg,rgba(28,22,19,.95),rgba(18,15,13,.9));border-bottom:2px solid var(--or);z-index:3}
header b{font:700 18px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-style:italic}header b i{color:var(--or);font-style:italic}
.views{display:flex;gap:4px;background:#0b0908;padding:3px;border-radius:9px;border:1px solid var(--rule)}
.views button{background:none;border:0;color:var(--mute);padding:7px 11px;border-radius:7px;font:600 12.5px Inter,sans-serif;cursor:pointer}.views button:hover{color:var(--ink)}
.pill{transition:opacity .3s;position:absolute;left:12px;top:62px;z-index:3;background:rgba(15,13,12,.85);border:1px solid var(--rule);border-radius:9px;padding:7px 10px;font-size:12px;max-width:min(520px,calc(100% - 24px))}.pill b{color:var(--or2)}
.perf{position:absolute;left:12px;bottom:34px;z-index:3;background:rgba(15,13,12,.85);border:1px solid var(--rule);border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--mute)}
.q{position:absolute;right:12px;top:62px;z-index:3;display:flex;gap:6px}.q button{background:rgba(15,13,12,.88);border:1px solid var(--rule);color:var(--ink);border-radius:8px;height:32px;padding:0 10px;cursor:pointer;font:600 12px Inter,sans-serif}.q button[aria-pressed="true"]{background:var(--or);color:#1b1207}
.cesium-viewer-bottom{z-index:3!important}.cesium-widget-credits{color:#fff!important;font-size:11px!important;background:rgba(15,13,12,.6)!important;padding:2px 6px!important;border-radius:6px}
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5;flex-direction:column;gap:8px}.loader.done{display:none}
.xnav{margin-left:auto;display:flex;gap:4px;align-items:center}.xnav a{color:var(--mute);text-decoration:none;font:600 12px Inter,sans-serif;padding:6px 9px;border-radius:7px;border:1px solid transparent}.xnav a:hover{color:var(--ink);border-color:var(--rule)}.xnav a[aria-current=page]{color:var(--ink);background:#0b0908;border-color:var(--rule)}.xnav[hidden]{display:none}@media(max-width:900px){.xnav a{padding:5px 6px;font-size:11px}}
/* v6.90: search, the compass, orbit, trade chips */
:root{--hh:50px}
.q{top:calc(var(--hh) + 12px)}
.find{position:absolute;left:12px;top:calc(var(--hh) + 12px);z-index:4;width:min(320px,calc(100% - 24px))}
.find input{box-sizing:border-box;width:100%;height:36px;border-radius:9px;border:1px solid var(--rule);background:rgba(15,13,12,.92);color:var(--ink);padding:0 12px;font:600 13px Inter,system-ui,sans-serif;outline:none}
.find input:focus{border-color:var(--or)}
.hits{margin-top:4px;background:rgba(15,13,12,.96);border:1px solid var(--rule);border-radius:9px;max-height:320px;overflow:auto}
.hits button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);color:var(--ink);padding:8px 12px;cursor:pointer;font:13px Inter,system-ui,sans-serif}
.hits button:hover,.hits button:focus-visible{background:#221c18;outline:none}.hits small{color:var(--mute)}.hits .none{padding:10px 12px;color:var(--mute);font-size:12.5px}
.pill{top:calc(var(--hh) + 56px)}
.rose3d{position:absolute;right:14px;top:calc(var(--hh) + 56px);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
.dialwrap{position:relative;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#2a221d 0,#15110f 72%);border:1px solid var(--rule);box-shadow:0 3px 14px rgba(0,0,0,.5)}
.dialwrap::after{content:'';position:absolute;left:50%;top:-1px;margin-left:-6px;border:6px solid transparent;border-top:9px solid var(--or);border-bottom:0}
#dial{position:absolute;inset:0;border-radius:50%;transition:none}
#dial::before{content:'';position:absolute;inset:18px;border-radius:50%;border:1.5px solid rgba(243,239,233,.14)}
#dial [data-face]{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--ink);transform:rotate(var(--b)) translateY(-29px)}
#dial [data-face] b{display:block;font:800 13px/28px Inter,system-ui,sans-serif;border-radius:50%}
#dial [data-face="0"]{color:var(--or)}
#dial [data-face]:hover b,#dial [data-face]:focus-visible b{background:var(--ink);color:#1b1207}
#dial [data-face]:focus-visible{outline:none}
.facing{font:700 11px/1 Inter,system-ui,sans-serif;background:rgba(15,13,12,.9);border:1px solid var(--rule);padding:5px 9px;border-radius:10px;white-space:nowrap}
#orbitBtn{background:rgba(15,13,12,.9);border:1px solid var(--rule);color:var(--ink);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;font:600 12px Inter,sans-serif}
#orbitBtn[aria-pressed="true"]{background:var(--or);color:#1b1207}
.chips{position:absolute;left:12px;right:12px;bottom:66px;z-index:3;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.chips button{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(15,13,12,.88);border:1px solid var(--rule);color:var(--mute);border-radius:16px;height:28px;padding:0 10px;cursor:pointer;font:600 11.5px Inter,system-ui,sans-serif}
.chips button i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.45}
.chips button[aria-pressed="true"]{color:var(--ink);border-color:var(--c)}.chips button[aria-pressed="true"] i{opacity:1}
.chips small{color:var(--mute);font-weight:500}
@media(max-width:900px){
  header{height:auto;flex-wrap:wrap;row-gap:6px;padding:6px 10px}header>span{display:none}header b{font-size:15px}
  .xnav{margin-left:auto}.views{order:3;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}.views button{flex:none;padding:6px 9px}
  .q{right:10px;gap:5px}.q>span{display:none}.q .fsl{display:none}.q button{padding:0 9px}
  .q{top:calc(var(--hh) + 8px)}.find{width:calc(100% - 20px);left:10px;top:calc(var(--hh) + 50px)}.pill{left:10px;top:calc(var(--hh) + 96px);max-width:calc(100% - 116px);font-size:11.5px}
  .rose3d{right:10px;top:calc(var(--hh) + 96px)}.dialwrap{width:74px;height:74px}#dial [data-face]{transform:rotate(var(--b)) translateY(-24px)}#dial::before{inset:15px}
  .chips{flex-wrap:nowrap;overflow-x:auto;pointer-events:auto;scrollbar-width:none;bottom:62px}.chips button{flex:none}
  .perf{display:none}}
/* v6.99 - inside the Map explorer: the model only; the explorer's search and chips drive it */
body.embed3d .find,body.embed3d .chips,body.embed3d .xnav,body.embed3d .perf{display:none !important}
body.embed3d .pill{max-width:min(420px,calc(100% - 24px))}
body.embed3d header>b,body.embed3d header>span{display:none !important}   /* the explorer's own title is above it */

async function loadPins() {

      label: {text: p.k, font: '700 13px Inter, system-ui, sans-serif', fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.fromCssColorString('#0f0d0c'), outlineWidth: 4, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -38), heightReference: Cesium.HeightReference.CLAMP_TO_3D_TILE, distanceDisplayCondition: labelFar, scaleByDistance: far, disableDepthTestDistance: 2500,
        showBackground: true, backgroundColor: Cesium.Color.fromCssColorString(t.c).withAlpha(.9), backgroundPadding: new Cesium.Cartesian2(6, 3)}});

function chips() {

  $('chips').innerHTML = Object.entries(TRADES).filter(([k]) => counts[k]).map(([k, t]) => `<button data-t="${k}" aria-pressed="${shown.has(k)}" style="--c:${t.c}"><i></i>${t.name} <small>${counts[k]}</small></button>`).join('');
  $('chips').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; const k = b.dataset.t; if (shown.has(k)) shown.delete(k); else shown.add(k); b.setAttribute('aria-pressed', String(shown.has(k))); for (const en of pinEntities) en.show = shown.has(en._gc.t); viewer.scene.requestRender(); };
}
function describe(p) {

}
/* the schedule's own name, unless it only repeats the trade ("Toilets", "Generator") */
const ownName = p => { const n = (p.n || '').trim(), g = n.toLowerCase().replace(/s$/, ''); return !n || n === p.k || ['toilet', 'generator', 'entry point', 'ee genset', 'gate', 'big screen ' + p.k.toLowerCase()].includes(g) || g === ((TRADES[p.t] || TRADES.other).name.toLowerCase().replace(/s$/, '')) ? '' : n; };

function search() {

  const hits = PINS.filter(p => p.k.toUpperCase().replace(/\s+/g, '').includes(q) || (p.n || '').toUpperCase().includes(q)).sort((a, b) => (a.k.toUpperCase() === q ? -1 : 0) - (b.k.toUpperCase() === q ? -1 : 0) || a.k.length - b.k.length).slice(0, 12);
  box.hidden = false; box.innerHTML = hits.length ? hits.map((p, i) => `<button data-i="${PINS.indexOf(p)}"><b>${esc(p.k)}</b> <small>${esc((TRADES[p.t] || TRADES.other).name)}${ownName(p) ? ' · ' + esc(ownName(p)) : ''}</small></button>`).join('') : '<div class="none">No pin by that name. Units the master plan does not place have no pin.</div>';
}
async function boot() {
  try {
    const k = await key(); $('loadText').textContent = 'Starting the 3D scene…';
    viewer = new Cesium.Viewer('cesium', {baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false, navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false, infoBox: false, selectionIndicator: false,
      requestRenderMode: true, maximumRenderTimeChange: Infinity, msaaSamples: PHONE ? 2 : 4, contextOptions: {webgl: {powerPreference: 'high-performance', antialias: true}}});

      cacheBytes: PHONE ? 384 * 1048576 : 1024 * 1048576, maximumCacheOverflowBytes: PHONE ? 256 * 1048576 : 512 * 1048576,
      preloadFlightDestinations: true, cullRequestsWhileMoving: true, cullRequestsWhileMovingMultiplier: 60, foveatedScreenSpaceError: true, foveatedConeSize: .25,

    document.querySelectorAll('.q button[data-q]').forEach(b => b.onclick = () => { quality = b.dataset.q; qualityChosen = true; applyQuality(); });
    document.querySelectorAll('#dial [data-face]').forEach(b => b.onclick = () => faceTo(+b.dataset.face));
    $('orbitBtn').onclick = () => orbit ? stopOrbit() : startOrbit();

    const h = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
    h.setInputAction(e => { const o = sc.pick(e.position); if (o && o.id && o.id._gc) { if (EMBED3D) { ringAt(o.id._gc); sc.requestRender(); try { window.parent.gc500Explorer3DPick && window.parent.gc500Explorer3DPick(o.id._gc.k); } catch (x) {} } else setStatus(describe(o.id._gc)); } }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

}

boot();
window.GC500_3D = {fly, faceTo, startOrbit, stopOrbit,

  showGroups: ids => { GROUPS = ids ? new Set(ids) : null; for (const en of pinEntities) en.show = visible(en._gc); if (viewer) viewer.scene.requestRender(); },
  find: code => { const c = String(code || '').toUpperCase().replace(/\s+/g, ''); const p = PINS.find(x => x.k.toUpperCase().replace(/\s+/g, '') === c); if (p && viewer) { flyToPin(p, !EMBED3D); return true; } return false; },
  ring: code => { const c = String(code || '').toUpperCase().replace(/\s+/g, ''); ringAt(PINS.find(x => x.k.toUpperCase().replace(/\s+/g, '') === c) || null); if (viewer) viewer.scene.requestRender(); }, get state() { return {ready: !!viewer, quality, perf, loaded: window.__allLoaded, pins: PINS.length, heading: viewer ? Cesium.Math.toDegrees(viewer.camera.heading) : null}; }, setQuality: q => { quality = q; applyQuality(); }};

<script>
(function(){ /* page-to-page navigation from the link's own token; hidden inside the dashboard's frame */
  const m = /^\/w\/([A-Za-z0-9_-]{16,128})\//.exec(location.pathname), nav = document.getElementById('xnav'); if (!nav) return;
  const framed = (function(){ try { return window.self !== window.top; } catch (e) { return true; } })();
