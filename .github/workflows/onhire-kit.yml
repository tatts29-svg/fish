name: On-hire kit regression checks
on:
  pull_request:
    paths:
      - '02_Onhire_Report_Kit/**'
      - '.github/workflows/onhire-kit.yml'
  push:
    paths:
      - '02_Onhire_Report_Kit/**'
      - '.github/workflows/onhire-kit.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s 02_Onhire_Report_Kit/tests -v
